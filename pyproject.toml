[project]
name = "fincrime-lab"
version = "0.1.0"
description = "Fraud, AML, experimentation and fraud-loss modelling for a simulated Mexican neobank."
readme = "README.md"
license = "MIT"
authors = [{ name = "Miguel Vilchis", email = "migue.vilchis@ciencias.unam.mx" }]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "kaggle>=2.2.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
fincrime = "fincrime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fincrime"]

# ── Linting & formatting ──
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "B",        # bugbear (likely bugs)
  "UP",       # modern Python syntax
  "NPY",      # NumPy-specific rules
  "PD",       # pandas-specific rules
  "SIM",      # simplifications
  "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "E501"]  # SQL strings in tests
"src/fincrime/bank/acceptance.py" = ["E501"]  # SQL and report prose read better on long lines
"src/fincrime/figures.py" = ["E501"]  # chart titles and SQL are text
"src/fincrime/ingest/report.py" = ["E501"]  # report prose
"src/fincrime/lake/*.py" = ["E501"]  # SQL strings
"src/fincrime/cli.py" = ["E501"]  # help text and status lines

# ── Tests ──
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: needs internet access (skipped in CI unless enabled)",
  "slow: long-running test",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]
